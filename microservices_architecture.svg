<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1200" height="800" viewBox="0 0 1200 800">
  <!-- Title -->
  <text x="600" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">
    User Management Microservices Architecture
  </text>
  
  <!-- Background -->
  <rect x="50" y="60" width="1100" height="700" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" rx="10"/>
  
  <!-- Legend -->
  <g id="legend">
    <text x="70" y="90" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Legend:</text>
    <line x1="70" y1="100" x2="110" y2="100" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowblue)"/>
    <text x="120" y="105" font-family="Arial, sans-serif" font-size="11" fill="#666">REST/HTTP</text>
    
    <line x1="70" y1="120" x2="110" y2="120" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowred)"/>
    <text x="120" y="125" font-family="Arial, sans-serif" font-size="11" fill="#666">NATS RPC</text>
    
    <line x1="70" y1="140" x2="110" y2="140" stroke="#16a34a" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrowgreen)"/>
    <text x="120" y="145" font-family="Arial, sans-serif" font-size="11" fill="#666">NATS PubSub</text>
    
    <line x1="200" y1="100" x2="240" y2="100" stroke="#9333ea" stroke-width="2" marker-end="url(#arrowpurple)"/>
    <text x="250" y="105" font-family="Arial, sans-serif" font-size="11" fill="#666">WebSocket</text>
    
    <line x1="200" y1="120" x2="240" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arrowgray)"/>
    <text x="250" y="125" font-family="Arial, sans-serif" font-size="11" fill="#666">Database</text>
  </g>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowpurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9333ea"/>
    </marker>
    <marker id="arrowgray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  
  <!-- Users (Clients) -->
  <g id="users">
    <!-- User U1 -->
    <g id="user1">
      <circle cx="120" cy="300" r="25" fill="#fff" stroke="#333" stroke-width="2"/>
      <circle cx="120" cy="290" r="8" fill="#333"/>
      <path d="M 105 310 Q 120 305 135 310" stroke="#333" stroke-width="2" fill="none"/>
      <text x="120" y="345" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">U1</text>
    </g>
    
    <!-- User U2 -->
    <g id="user2">
      <circle cx="120" cy="420" r="25" fill="#fff" stroke="#333" stroke-width="2"/>
      <circle cx="120" cy="410" r="8" fill="#333"/>
      <path d="M 105 430 Q 120 425 135 430" stroke="#333" stroke-width="2" fill="none"/>
      <text x="120" y="465" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">U2</text>
    </g>
    
    <!-- User U3 -->
    <g id="user3">
      <circle cx="120" cy="540" r="25" fill="#fff" stroke="#333" stroke-width="2"/>
      <circle cx="120" cy="530" r="8" fill="#333"/>
      <path d="M 105 550 Q 120 545 135 550" stroke="#333" stroke-width="2" fill="none"/>
      <text x="120" y="585" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">U3</text>
    </g>
  </g>
  
  <!-- API Gateway Service -->
  <g id="api-gateway">
    <rect x="280" y="220" width="250" height="350" fill="#fef3c7" stroke="#f59e0b" stroke-width="3" rx="10"/>
    <text x="405" y="245" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#92400e">
      API Gateway Service
    </text>
    <text x="405" y="265" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#78350f">
      Port: 8080
    </text>
    
    <!-- Components inside API Gateway -->
    <rect x="295" y="280" width="220" height="50" fill="#fff" stroke="#f59e0b" stroke-width="2" rx="5"/>
    <text x="405" y="300" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">
      REST Handlers
    </text>
    <text x="405" y="318" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">
      POST, GET, PATCH, DELETE
    </text>
    
    <rect x="295" y="345" width="220" height="50" fill="#fff" stroke="#f59e0b" stroke-width="2" rx="5"/>
    <text x="405" y="365" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">
      WebSocket Server
    </text>
    <text x="405" y="383" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">
      Connection Manager
    </text>
    
    <rect x="295" y="410" width="220" height="50" fill="#fff" stroke="#f59e0b" stroke-width="2" rx="5"/>
    <text x="405" y="430" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">
      NATS RPC Client
    </text>
    <text x="405" y="448" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">
      Request Forwarder
    </text>
    
    <rect x="295" y="475" width="220" height="50" fill="#fff" stroke="#f59e0b" stroke-width="2" rx="5"/>
    <text x="405" y="495" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">
      NATS PubSub Subscriber
    </text>
    <text x="405" y="513" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">
      Event Listener
    </text>
  </g>
  
  <!-- NATS Broker -->
  <g id="nats">
    <ellipse cx="650" cy="400" rx="100" ry="140" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="650" y="330" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#14532d">
      NATS Broker
    </text>
    <text x="650" y="350" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#166534">
      Port: 4222
    </text>
    
    <!-- NATS Components -->
    <rect x="580" y="370" width="140" height="30" fill="#fff" stroke="#16a34a" stroke-width="2" rx="5"/>
    <text x="650" y="390" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">
      RPC Channels
    </text>
    
    <rect x="580" y="410" width="140" height="60" fill="#fff" stroke="#16a34a" stroke-width="2" rx="5"/>
    <text x="650" y="428" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">
      user.create
    </text>
    <text x="650" y="442" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">
      user.get | user.list
    </text>
    <text x="650" y="456" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">
      user.update | user.delete
    </text>
    
    <rect x="580" y="480" width="140" height="40" fill="#fff" stroke="#16a34a" stroke-width="2" rx="5"/>
    <text x="650" y="498" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">
      PubSub Topics
    </text>
    <text x="650" y="512" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">
      user.events.*
    </text>
  </g>
  
  <!-- USER Service -->
  <g id="user-service">
    <rect x="850" y="220" width="250" height="350" fill="#dbeafe" stroke="#2563eb" stroke-width="3" rx="10"/>
    <text x="975" y="245" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e3a8a">
      USER Service
    </text>
    <text x="975" y="265" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e40af">
      Port: 8081
    </text>
    
    <!-- Components inside USER Service -->
    <rect x="865" y="280" width="220" height="50" fill="#fff" stroke="#2563eb" stroke-width="2" rx="5"/>
    <text x="975" y="300" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">
      NATS RPC Server
    </text>
    <text x="975" y="318" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">
      Request Handler
    </text>
    
    <rect x="865" y="345" width="220" height="50" fill="#fff" stroke="#2563eb" stroke-width="2" rx="5"/>
    <text x="975" y="365" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">
      Service Layer
    </text>
    <text x="975" y="383" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">
      Business Logic
    </text>
    
    <rect x="865" y="410" width="220" height="50" fill="#fff" stroke="#2563eb" stroke-width="2" rx="5"/>
    <text x="975" y="430" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">
      Repository Layer
    </text>
    <text x="975" y="448" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">
      Database Operations
    </text>
    
    <rect x="865" y="475" width="220" height="50" fill="#fff" stroke="#2563eb" stroke-width="2" rx="5"/>
    <text x="975" y="495" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">
      NATS PubSub Publisher
    </text>
    <text x="975" y="513" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">
      Event Publisher
    </text>
  </g>
  
  <!-- PostgreSQL Database -->
  <g id="database">
    <rect x="900" y="625" width="150" height="100" fill="#f1f5f9" stroke="#64748b" stroke-width="3" rx="5"/>
    <ellipse cx="975" cy="645" rx="60" ry="15" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
    <ellipse cx="975" cy="645" rx="50" ry="12" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <ellipse cx="975" cy="645" rx="40" ry="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="975" y="690" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e293b">
      PostgreSQL
    </text>
    <text x="975" y="708" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#475569">
      USER_DB
    </text>
  </g>
  
  <!-- Connections -->
  
  <!-- U1 to API Gateway (REST) -->
  <line x1="145" y1="300" x2="280" y2="300" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowblue)"/>
  <text x="212" y="290" font-family="Arial, sans-serif" font-size="10" fill="#2563eb">REST</text>
  
  <!-- U2 and U3 to API Gateway (WebSocket) -->
  <path d="M 145 420 Q 180 420 280 390" stroke="#9333ea" stroke-width="2" fill="none" marker-end="url(#arrowpurple)"/>
  <text x="180" y="410" font-family="Arial, sans-serif" font-size="10" fill="#9333ea">WS</text>
  
  <path d="M 145 540 Q 180 540 280 520" stroke="#9333ea" stroke-width="2" fill="none" marker-end="url(#arrowpurple)"/>
  <text x="180" y="530" font-family="Arial, sans-serif" font-size="10" fill="#9333ea">WS</text>
  
  <!-- API Gateway to NATS (RPC) -->
  <line x1="530" y1="435" x2="560" y2="420" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowred)"/>
  <text x="540" y="425" font-family="Arial, sans-serif" font-size="10" fill="#dc2626">RPC</text>
  
  <!-- NATS to USER Service (RPC) -->
  <line x1="740" y1="370" x2="850" y2="305" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowred)"/>
  <text x="780" y="330" font-family="Arial, sans-serif" font-size="10" fill="#dc2626">RPC</text>
  
  <!-- USER Service to NATS (PubSub) -->
  <line x1="850" y1="500" x2="740" y2="460" stroke="#16a34a" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrowgreen)"/>
  <text x="780" y="475" font-family="Arial, sans-serif" font-size="10" fill="#16a34a">Events</text>
  
  <!-- NATS to API Gateway (PubSub) -->
  <line x1="560" y1="480" x2="530" y2="490" stroke="#16a34a" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrowgreen)"/>
  <text x="540" y="475" font-family="Arial, sans-serif" font-size="10" fill="#16a34a">Events</text>
  
  <!-- USER Service to Database -->
  <line x1="975" y1="570" x2="975" y2="625" stroke="#64748b" stroke-width="2" marker-end="url(#arrowgray)"/>
  <text x="985" y="600" font-family="Arial, sans-serif" font-size="10" fill="#64748b">SQL</text>
  
  <!-- Flow annotations -->
  <g id="flow-annotations">
    <!-- Flow 1: REST Request -->
    <rect x="70" y="650" width="350" height="90" fill="#fff" stroke="#e5e7eb" stroke-width="1" rx="5"/>
    <text x="245" y="670" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">
      Flow 1: CRUD Operation
    </text>
    <text x="80" y="690" font-family="Arial, sans-serif" font-size="10" fill="#666">
      1. U1 sends REST request (e.g., PATCH /users/123)
    </text>
    <text x="80" y="705" font-family="Arial, sans-serif" font-size="10" fill="#666">
      2. API Gateway forwards via NATS RPC
    </text>
    <text x="80" y="720" font-family="Arial, sans-serif" font-size="10" fill="#666">
      3. USER Service updates DB and publishes event
    </text>
    <text x="80" y="735" font-family="Arial, sans-serif" font-size="10" fill="#666">
      4. API Gateway broadcasts to U2, U3 (not U1)
    </text>
    
    <!-- Flow 2: Event Broadcasting -->
    <rect x="450" y="650" width="350" height="90" fill="#fff" stroke="#e5e7eb" stroke-width="1" rx="5"/>
    <text x="625" y="670" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">
      Flow 2: Event Broadcasting
    </text>
    <text x="460" y="690" font-family="Arial, sans-serif" font-size="10" fill="#666">
      1. USER Service publishes event (user.events.updated)
    </text>
    <text x="460" y="705" font-family="Arial, sans-serif" font-size="10" fill="#666">
      2. API Gateway subscribes and receives event
    </text>
    <text x="460" y="720" font-family="Arial, sans-serif" font-size="10" fill="#666">
      3. API Gateway filters and broadcasts via WebSocket
    </text>
    <text x="460" y="735" font-family="Arial, sans-serif" font-size="10" fill="#666">
      4. Connected clients receive real-time updates
    </text>
  </g>
  
  <!-- Communication patterns box -->
  <rect x="850" y="650" width="300" height="90" fill="#fef2f2" stroke="#dc2626" stroke-width="2" rx="5"/>
  <text x="1000" y="670" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">
    Communication Patterns
  </text>
  <text x="860" y="690" font-family="Arial, sans-serif" font-size="10" fill="#666">
    • Synchronous: REST → NATS RPC → DB → Response
  </text>
  <text x="860" y="707" font-family="Arial, sans-serif" font-size="10" fill="#666">
    • Asynchronous: DB Update → NATS PubSub → WS
  </text>
  <text x="860" y="724" font-family="Arial, sans-serif" font-size="10" fill="#666">
    • Real-time: WebSocket for instant notifications
  </text>
  
</svg>
